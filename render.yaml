services:
  - type: web
    name: scorestreamlive-bootstrap
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: Dockerfile
    envVars:
      - key: APP_NAME
        value: ScoreStreamLive
      - key: APP_ENV
        value: production
      - key: APP_VERSION
        value: 0.1.0
      - key: LOG_LEVEL
        value: INFO
    healthCheckPath: /health/live