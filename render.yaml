services:
  - type: web
    name: scorestreamlive-bootstrap
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: Dockerfile
    envVars:
      - key: APP_NAME
        value: ScoreStreamLive
      - key: APP_ENV
        value: production
      - key: APP_VERSION
        value: 0.5.0
      - key: LOG_LEVEL
        value: INFO
      - key: SOCKET_CORS_ORIGINS
        value: https://scorestreamlive.onrender.com
      # Database credentials must be set manually in the Render dashboard
      # after creating a managed PostgreSQL database.
      # Required: DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
    healthCheckPath: /health/live