<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ScoreStreamLive Overlay</title>
  <link rel="stylesheet" href="/static/css/overlay.css">
</head>
<body data-game-id="{{ game_id }}">
  <main class="overlay-stage" aria-label="ScoreStreamLive broadcast scoreboard">
    <section id="overlay-scoreboard" class="overlay-scoreboard overlay-loading">
      <div class="team team-home">
        <div id="home-team-name" class="team-name">HOME</div>
        <div id="home-score" class="team-score">0</div>
      </div>

      <div class="match-center">
        <div id="clock-display" class="clock-display">00:00</div>
        <div id="phase-display" class="phase-display">PREGAME</div>
      </div>

      <div class="team team-away">
        <div id="away-score" class="team-score">0</div>
        <div id="away-team-name" class="team-name">AWAY</div>
      </div>
    </section>

    <div id="overlay-error" class="overlay-error hidden" role="status">
      SCORESTREAMLIVE DATA UNAVAILABLE
    </div>
  </main>

  <script src="/static/vendor/socket.io.min.js"></script>
  <script type="module" src="/static/js/overlay/overlay.js"></script>
</body>
</html>
