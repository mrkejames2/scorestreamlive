<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activate — ScoreStreamLive</title><link rel="stylesheet" href="/static/css/auth.css">  <link rel="stylesheet" href="/static/css/product-theme-m17h.css?v=m17h-r1">
  <link rel="icon" href="/static/brand/scorestreamlive-mark.svg?v=m17h-1" type="image/svg+xml">
</head><body><main class="auth-shell"><section class="auth-card"><div class="auth-brand">ScoreStreamLive</div><h1>Activate your account</h1><p>Join <strong>{{ club.name }}</strong> as <strong>{{ invitation.club_role|title }}</strong>.</p><p>{{ invitation.email }}</p>{% if error %}<div class="auth-error">{{ error }}</div>{% endif %}<form method="post" action="/activate" class="auth-form"><input type="hidden" name="token" value="{{ token }}"><label>Display Name<input name="display_name" value="{{ invitation.display_name or '' }}"></label><label>Password<input type="password" name="password" minlength="10" required></label><label>Confirm Password<input type="password" name="confirm_password" minlength="10" required></label><button>Activate Account</button></form></section></main></body></html>
