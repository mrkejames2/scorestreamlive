<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Resend activation | ScoreStreamLive</title>

  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      background: #f3f4f6;
      color: #111827;
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(100%, 440px);
      background: #fff;
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 12px 36px rgba(0,0,0,.10);
    }

    h1 {
      margin: 0 0 8px;
    }

    p {
      color: #4b5563;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 16px;
      font-weight: 650;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      margin-top: 6px;
      padding: 11px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font: inherit;
    }

    button,
    .button {
      display: inline-block;
      box-sizing: border-box;
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #111827;
      color: #fff;
      font: inherit;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    .secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .success {
      padding: 10px 12px;
      background: #dcfce7;
      color: #166534;
      border-radius: 8px;
    }

    .brand {
      font-size: .9rem;
      font-weight: 800;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: #374151;
    }
  </style>

  <link
    rel="stylesheet"
    href="/static/css/product-theme-m17h.css?v=m17h-r1"
  >

  <link
    rel="icon"
    href="/static/brand/scorestreamlive-mark.svg?v=m17h-1"
    type="image/svg+xml"
  >
</head>

<body>
<main>
  <section class="card">
    <div class="brand">ScoreStreamLive</div>

    <h1>Resend account activation</h1>

    <p>
      Enter the email address you used when creating your
      ScoreStreamLive account.
    </p>

    <p>
      If an account is waiting for activation, we'll send a new secure
      activation link.
    </p>

    {% if message %}
      <div class="success" role="status">
        {{ message }}
      </div>
    {% endif %}

    <form method="post" action="/resend-activation">
      <label for="email">Email</label>

      <input
        id="email"
        name="email"
        type="email"
        autocomplete="email"
        required
      >

      <button type="submit">Send activation link</button>
    </form>

    <a class="button secondary" href="/login">
      Back to sign in
    </a>
  </section>
</main>
</body>
</html>
