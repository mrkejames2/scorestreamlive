<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password | ScoreStreamLive</title><style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{margin:0;background:#f3f4f6;color:#111827}main{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(100%,440px);background:#fff;border-radius:14px;padding:28px;box-shadow:0 12px 36px rgba(0,0,0,.10)}h1{margin:0 0 8px}p{color:#4b5563;line-height:1.5}label{display:block;margin-top:16px;font-weight:650}input{width:100%;box-sizing:border-box;margin-top:6px;padding:11px 12px;border:1px solid #d1d5db;border-radius:8px;font:inherit}button,.button{display:inline-block;box-sizing:border-box;width:100%;margin-top:20px;padding:12px;border:0;border-radius:8px;background:#111827;color:#fff;font:inherit;font-weight:700;text-align:center;text-decoration:none;cursor:pointer}.secondary{background:#e5e7eb;color:#111827}.error{padding:10px 12px;background:#fee2e2;color:#991b1b;border-radius:8px}.success{padding:10px 12px;background:#dcfce7;color:#166534;border-radius:8px}.brand{font-size:.9rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#374151}
</style></head>
<body><main><section class="card"><div class="brand">ScoreStreamLive</div><h1>Reset password</h1><p>Choose a new password with at least 10 characters.</p>
{% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="/reset-password"><input type="hidden" name="token" value="{{ token }}"><label for="password">New password</label><input id="password" name="password" type="password" minlength="10" autocomplete="new-password" required><label for="password-confirm">Confirm new password</label><input id="password-confirm" name="password_confirm" type="password" minlength="10" autocomplete="new-password" required><button type="submit">Reset password</button></form>
</section></main></body></html>
