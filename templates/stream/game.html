<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ScoreStreamLive — Stream</title>
  <link rel="stylesheet" href="/static/css/broadcast-m19h.css?v=m19h-2">
  <link rel="icon" href="/static/brand/scorestreamlive-mark.svg?v=m17h-1" type="image/svg+xml">
</head>
<body data-game-id="{{ game_id }}">
  <main id="broadcast-root">
    <div id="intro-scene" class="scene hidden">
      <img id="intro-image" alt="Game welcome screen">
    </div>
    <iframe
      id="live-scene"
      class="scene"
      title="ScoreStreamLive live game"
      src="/overlay/games/{{ game_id }}">
    </iframe>
  </main>
  <script src="/static/vendor/socket.io.min.js"></script>
  <script type="module" src="/static/js/broadcast/game-m19h.js?v=m19h-2"></script>
</body>
</html>
