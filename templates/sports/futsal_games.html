<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Futsal Games — ScoreStreamLive</title><style>body{font:16px system-ui;background:#0b1220;color:#f4f7fb;margin:0}main{max-width:1050px;margin:auto;padding:25px}a{color:#a6d4ff}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}button,input,select{padding:10px;border-radius:7px;border:1px solid #657084}button{cursor:pointer}article,form{background:#19263b;padding:16px;margin:12px 0;border-radius:10px}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.fields label{display:grid;gap:6px}#message{white-space:pre-wrap}</style></head><body><main><div class="toolbar"><h1>Futsal Games</h1><a href="/games">Soccer</a><a href="/sports">Switch Sport</a><a href="/teams">Soccer Teams</a></div><p>Futsal games and teams are isolated from Soccer. Clock and full match controls arrive in M21-C.</p><form id="team-form"><h2>Create Futsal Team</h2><div class="fields"><label>Team name<input id="team-name" required maxlength="255"></label><label>Short name<input id="team-short" maxlength="100"></label></div><p><button type="submit">Create Futsal Team</button></p></form><form id="game-form"><h2>Create Futsal Game</h2><div class="fields"><label>Game name<input id="game-name" required maxlength="255"></label><label>Home team<select id="home-team" required></select></label><label>Away team<select id="away-team" required></select></label></div><p><button type="submit">Create Futsal Game</button></p></form><p id="message" role="status"></p><h2>Futsal Games</h2><section id="games"></section></main><script>
const el=id=>document.getElementById(id),msg=s=>el('message').textContent=s;
async function api(path,options={}){const r=await fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...options});if(!r.ok)throw Error(`${r.status}: ${await r.text()}`);return r.json()}
async function refresh(){try{const [teams,games]=await Promise.all([api('/api/teams?sport=futsal'),api('/api/games?sport=futsal')]);for(const id of ['home-team','away-team']){const select=el(id);select.replaceChildren(new Option('Choose team',''));teams.forEach(t=>select.add(new Option(t.name,t.id)))}el('games').replaceChildren();for(const g of games){const card=document.createElement('article'),a=document.createElement('a');a.href='/games/'+g.id;a.textContent=g.name;card.append(a,document.createTextNode(' — '+g.status));el('games').append(card)}}catch(e){msg('Unable to load: '+e.message)}}
el('team-form').onsubmit=async e=>{e.preventDefault();try{await api('/api/teams',{method:'POST',body:JSON.stringify({name:el('team-name').value.trim(),short_name:el('team-short').value.trim()||null,sport:'futsal'})});msg('Futsal team created');await refresh()}catch(e){msg(e.message)}};
el('game-form').onsubmit=async e=>{e.preventDefault();const h=el('home-team').value,a=el('away-team').value;if(!h||!a||h===a){msg('Select two different teams');return}try{await api('/api/games',{method:'POST',body:JSON.stringify({name:el('game-name').value.trim(),home_team_id:h,away_team_id:a,sport:'futsal'})});msg('Futsal game created');await refresh()}catch(e){msg(e.message)}};refresh();
</script></body></html>
