<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Futsal Clock | ScoreStreamLive</title><style>body{font:16px system-ui;background:#0e2636;color:#fff;max-width:780px;margin:3rem auto;padding:1rem}button,input,select{font:inherit;padding:.65rem;margin:.3rem}button{cursor:pointer}#time{font-size:clamp(4rem,14vw,8rem);font-variant-numeric:tabular-nums}#error{color:#ffb4b4}a{color:#a6d4ff}</style></head><body><p><a href="/futsal/games">← Futsal Games</a></p><h1>Futsal Countdown Clock</h1><p id="details">Loading…</p><div id="time">--:--</div><p id="status"></p><section id="setup" hidden><label>Half length (minutes) <input id="minutes" type="number" min="1" max="60" value="20"></label><label>Clock rules <select id="policy"><option value="stop_clock">Stop clock</option><option value="running_clock">Running clock</option></select></label><button id="initialize">Initialize clock</button></section><section id="controls" hidden><button data-action="start">Start</button><button data-action="pause">Pause</button><button data-action="resume">Resume</button><button data-action="reset">Reset half</button><button data-action="next-period">Start second-half setup</button></section><p id="error" role="alert"></p><p>Running-clock mode does not automatically pause on stoppages. Stop-clock mode uses manual pause/resume in this milestone; automated referee stoppages are not yet implemented.</p><script>window.FUTSAL_GAME_ID={{ game_id | tojson }};</script><script type="module" src="/static/js/sports/futsal_clock.js"></script></body></html>
