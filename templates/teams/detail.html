<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ScoreStreamLive — Team Detail</title><link rel="stylesheet" href="/static/css/team-detail.css">
</head>
<body>
<main class="detail-shell" data-team-id="{{ team_id }}">
<header class="topbar"><a class="back" href="/teams">← Teams</a><span id="detail-status" class="status">LOADING</span></header>
<section id="detail-error" class="notice hidden" role="alert"></section>
<section id="team-hero" class="hero hidden">
  <div id="hero-accent" class="hero-accent"></div>
  <div class="hero-body">
    <div class="logo-shell"><span id="logo-fallback">T</span><img id="team-logo" class="hidden" alt=""></div>
    <div class="identity"><div class="eyebrow">SCORESTREAMLIVE · M13-C</div><h1 id="team-name">Team</h1><div id="team-short" class="short-name"></div>
      <div class="colors"><span id="primary-swatch" class="swatch"></span><code id="primary-color">Not set</code><span id="secondary-swatch" class="swatch"></span><code id="secondary-color">Not set</code></div>
      <code id="team-id" class="team-id"></code>
    </div>
  </div>
</section>
<section class="roster-panel">
 <div class="panel-head"><div><div class="eyebrow">DERIVED FROM PLAYERS</div><h2>Roster</h2><p>Read-only in M13-C. Player management arrives in the next checkpoint.</p></div><strong id="roster-count">—</strong></div>
 <div id="roster-empty" class="empty hidden">No players are assigned to this Team yet.</div>
 <div id="roster-list" class="roster-list"></div>
</section>
<footer><span>Milestone M13-C</span><span>Team Detail &amp; Roster View</span></footer>
</main>
<script type="module" src="/static/js/teams/detail.js"></script>
</body></html>
