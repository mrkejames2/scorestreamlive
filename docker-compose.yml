services:
  postgres:
    image: postgres:16-alpine
    container_name: scorestreamlive-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scorestreamlive-bootstrap
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - TEAM_LOGO_STORAGE_DIR=/home/appuser/app/static/uploads/team-logos
    volumes:
      - team_logo_data:/home/appuser/app/static/uploads/team-logos
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  team_logo_data:
