<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ScoreStreamLive — Socket.IO Validation</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .status { padding: 12px; border-radius: 6px; margin: 12px 0; font-weight: 600; }
        .connected { background: #d4edda; color: #155724; }
        .disconnected { background: #f8d7da; color: #721c24; }
        .reconnecting { background: #fff3cd; color: #856404; }
        button { padding: 10px 18px; margin: 6px 4px; cursor: pointer; font-size: 14px; }
        #log, #games-log, #teams-log { border: 1px solid #ccc; padding: 12px; height: 200px; overflow-y: auto; font-family: monospace; font-size: 12px; background: #fafafa; }
        .log-entry { margin: 3px 0; padding: 3px 0; border-bottom: 1px solid #e0e0e0; }
        .section { margin: 24px 0; }
        h1 { font-size: 22px; }
        h2 { font-size: 16px; margin-top: 24px; }
        .game-card, .team-card { background: #fff; border: 1px solid #ddd; padding: 10px; margin: 6px 0; border-radius: 4px; }
        .game-card strong, .team-card strong { color: #333; }
    </style>
</head>
<body>
    <h1>ScoreStreamLive — Socket.IO Validation Client</h1>

    <div id="connection-status" class="status disconnected">Disconnected</div>
    <div>Socket ID: <span id="socket-id">-</span></div>

    <div class="section">
        <h2>Controls</h2>
        <button id="btn-ping">Send Ping</button>
        <button id="btn-broadcast">Send Broadcast</button>
        <button id="btn-disconnect">Force Disconnect</button>
    </div>

    <div class="section">
        <h2>Event Log</h2>
        <div id="log"></div>
    </div>

    <div class="section">
        <h2>Teams (via Socket.IO)</h2>
        <div id="teams-list"></div>
        <h3>Team Events</h3>
        <div id="teams-log"></div>
    </div>

    <div class="section">
        <h2>Games (via Socket.IO)</h2>
        <div id="games-list"></div>
        <h3>Game Events</h3>
        <div id="games-log"></div>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="/static/js/socket.js"></script>
</body>
</html>
