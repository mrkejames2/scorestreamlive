<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Get Started — ScoreStreamLive</title>
<style>:root{--n:#071d2d;--b:#1686d9;--g:#42c866;--i:#0b1f33;--m:#526477;--p:#f5f9fc;--l:#dbe5ec}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--p);color:var(--i)}header{background:var(--n);padding:20px}.brand{width:min(620px,calc(100% - 32px));margin:auto;color:white;font-weight:850;text-decoration:none;font-size:1.35rem}.brand em{color:var(--g);font-style:normal}main{width:min(620px,calc(100% - 32px));margin:60px auto}.card{background:white;border:1px solid var(--l);border-radius:18px;padding:36px}h1{margin:0}p{color:var(--m)}label{display:block;font-weight:750;margin:18px 0 7px}input{width:100%;padding:13px;border:1px solid #b9c9d5;border-radius:9px;font:inherit}button{width:100%;margin-top:24px;padding:14px;border:0;border-radius:10px;background:var(--b);color:white;font-weight:850}.msg{display:none;margin-top:18px;padding:13px;border-radius:9px}.error{display:block;background:#fff1f0;color:#8b1e1e}.success{display:block;background:#eefaf1;color:#17672c}</style></head>
<body><header><a class="brand" href="/">ScoreStream<em>Live</em></a></header><main><div class="card"><h1>Get started</h1><p>Tell us who you are and the organization you'll use with ScoreStreamLive.</p>
<form id="signup-form"><label>First name</label><input name="first_name" maxlength="100" required autocomplete="given-name"><label>Last name</label><input name="last_name" maxlength="100" required autocomplete="family-name"><label>Email</label><input name="email" type="email" maxlength="320" required autocomplete="email"><label>Organization / Club name</label><input name="organization_name" maxlength="180" required autocomplete="organization"><button id="submit">Continue</button></form><div id="message" class="msg" role="status"></div><p>No payment is collected on this page. Checkout is the next commercial milestone.</p></div></main><script src="/static/js/signup.js"></script></body></html>
